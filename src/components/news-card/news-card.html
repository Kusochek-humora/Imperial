<article class="news-card {{mod}}">
  <div class="news-card__media">
    <img class="news-card__img" src="{{img}}" alt="" width="348" height="178" loading="lazy" />
  </div>
  <div class="news-card__body">
    <div class="news-card__info">
      <h3 class="news-card__title">{{title}}</h3>
      <p class="news-card__text">{{text}}</p>
    </div>
    <div class="news-card__footer">
      <time class="news-card__date" datetime="{{datetime}}">{{date}}</time>
      <a class="news-card__link" href="{{href|#}}">Подробнее →</a>
    </div>
  </div>
</article>

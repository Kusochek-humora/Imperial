<!-- Карта-заглушка (картинка) до подключения Яндекс.Карт.
     Метки — кластеры с количеством объектов, позиция в % от размеров карты -->
<div class="map-preview {{mod}}" role="img" aria-label="Объекты на карте">
  <img class="map-preview__img" src="{{img|/src/assets/img/map.webp}}" alt="" width="1420" height="420" loading="lazy" />
  <span class="map-preview__marker" style="left: 47%; top: 30%">34</span>
  <span class="map-preview__marker" style="left: 74%; top: 46%">12</span>
  <span class="map-preview__marker" style="left: 37%; top: 66%">2</span>
</div>

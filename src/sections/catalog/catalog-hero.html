<!-- Шапка каталога: фото, крошки, заголовок, фильтр со «Списком / Картой». Параметры: title, crumb; parent-hidden="" — добавить «Каталог» между «Главной» и crumb -->
<section class="page-hero page-hero--catalog">
  <img class="page-hero__bg" src="/src/assets/img/home/hero.webp" alt="" width="1920" height="1920" fetchpriority="high" />
  <span class="page-hero__overlay"></span>
  <nav class="breadcrumbs breadcrumbs--light" aria-label="Хлебные крошки">
    <ol class="breadcrumbs__list">
      <li class="breadcrumbs__item"><a class="breadcrumbs__link" href="./index.html">Главная</a></li>
      <li class="breadcrumbs__item {{parent-hidden|breadcrumbs__item--hidden}}"><a class="breadcrumbs__link" href="./catalog.html">Каталог</a></li>
      <li class="breadcrumbs__item"><span aria-current="page">{{crumb}}</span></li>
    </ol>
  </nav>
  <div class="page-hero__content">
    <h1 class="page-hero__title">{{title}}</h1>
    <p class="page-hero__text">{{text}}</p>
  </div>
  <div class="page-hero__filter">
    <include src="src/components/filter/filter.html" id="catalog-filter" mod="filter--catalog" attrs="data-search-filter" list="false" map="true"></include>
  </div>
</section>

  <div class="faq-list container">
    <include src="src/components/faq-item/faq-item.html" open="open"
      question="1. Как проходит подбор коммерческой недвижимости?"
      answer="Мы начинаем с консультации, чтобы определить ваши задачи, бюджет, требования к площади и расположению. После этого специалисты Imperial Properties подбирают подходящие объекты из актуальной и закрытой базы, организуют просмотры и сопровождают вас на всех этапах сделки."></include>
    <include src="src/components/faq-item/faq-item.html"
      question="2. Какие объекты недвижимости вы предлагаете?"
      answer="Офисы, торговые помещения, помещения свободного назначения, склады, бизнес-центры, торговые комплексы и земельные участки — для покупки и аренды."></include>
    <include src="src/components/faq-item/faq-item.html"
      question="3. Можно ли обратиться к вам для продажи или сдачи собственного объекта?"
      answer="Да. Мы оценим рыночный потенциал объекта, предложим стратегию продажи или сдачи и возьмём на себя поиск клиентов и сопровождение сделки."></include>
    <include src="src/components/faq-item/faq-item.html"
      question="4. Сколько времени занимает подбор объекта?"
      answer="Обычно первые варианты мы предлагаем в течение нескольких дней после консультации. Общий срок зависит от требований к объекту и ситуации на рынке."></include>
    <include src="src/components/faq-item/faq-item.html"
      question="5. Сопровождаете ли вы сделку юридически?"
      answer="Да. Наши юристы проверяют объект и документы, готовят договор и сопровождают сделку до регистрации."></include>
    <include src="src/components/faq-item/faq-item.html"
      question="6. Работаете ли вы с инвестиционными объектами и крупными активами?"
      answer="Да, это одно из ключевых направлений: продажа и покупка бизнес-центров, торговых комплексов и других крупных коммерческих активов."></include>
